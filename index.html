<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ders Sayacı</title>
<script>
(function(){
 var c=document.createElement('canvas');c.width=c.height=180;
 var x=c.getContext('2d');
 x.fillStyle='#000';x.fillRect(0,0,180,180);
 x.fillStyle='#333';
 function kutu(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill()}
 kutu(14,50,70,80,10);kutu(96,50,70,80,10);
 x.fillStyle='#fff';x.font='bold 52px monospace';x.textAlign='center';
 x.fillText('00',49,107);x.fillText('50',131,107);
 var u=c.toDataURL('image/png');
 ['icon','apple-touch-icon'].forEach(function(t){
  document.querySelectorAll('link[rel="'+t+'"]').forEach(function(e){e.remove()});
  var l=document.createElement('link');l.rel=t;l.href=u;document.head.appendChild(l);
 });
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#000;color:#eee;min-height:100vh;display:flex;flex-direction:column;background-size:cover;background-position:center;background-attachment:fixed}
.top{display:flex;flex:1;min-height:60vh}
.side{width:230px;background:rgba(28,28,30,.85);padding:16px;display:flex;flex-direction:column;gap:10px}
.side h2{font-size:13px;color:#999;letter-spacing:1px}
#liste{display:flex;flex-direction:column;gap:10px}
.ders{padding:14px;border-radius:8px;cursor:pointer;border:2px solid transparent;font-weight:600;background:#050505;transition:.2s}
.ders:hover{background:#111}
.ders.aktif{border-color:#555}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px}
#secili{font-size:22px;font-weight:600}
#zaman{font-size:80px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{padding:12px 22px;border:none;border-radius:10px;font-size:16px;cursor:pointer;color:#fff;background:rgba(255,255,255,.15)}
button:hover{background:rgba(255,255,255,.28)}
button.sek{background:#050505;border:2px solid #333}
button.sek.aktif{border-color:#aaa}
.alt{background:rgba(28,28,30,.85);padding:20px}
.sekmeler{display:flex;gap:10px;margin-bottom:14px}
.satir{display:flex;justify-content:space-between;padding:12px 14px;margin-bottom:8px;background:#050505;border-radius:8px;font-weight:600}
.satir.toplam{color:#fff;border:1px solid #333}
#tam{display:none;position:fixed;inset:0;background:#000;z-index:10;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background-size:cover;background-position:center}
#tam .buyuk{font-size:min(22vw,200px);font-weight:200;font-variant-numeric:tabular-nums;color:#f4f4f4;text-shadow:0 2px 20px rgba(0,0,0,.8)}
#tam .ad{font-size:24px;margin-bottom:20px;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#tam .ipucu{position:absolute;bottom:20px;color:#888;font-size:13px}
@media(max-width:700px){.top{flex-direction:column}.side{width:100%}#zaman{font-size:56px}}
</style>
</head>
<body>
<div class="top">
 <div class="side">
  <h2>DERSLER</h2>
  <div id="liste"></div>
  <button onclick="document.getElementById('dosya').click()">Arka Plan Yükle</button>
  <button onclick="arkaSil()">Siyaha Dön</button>
  <input type="file" id="dosya" accept="image/*" style="display:none">
 </div>
 <div class="main">
  <div id="secili">Bir ders seç</div>
  <div id="zaman">00:00:00</div>
  <div class="btns">
   <button onclick="baslat()">Başlat</button>
   <button onclick="duraklat()">Duraklat</button>
   <button onclick="bitir()">Bitir ve Kaydet</button>
   <button onclick="tamEkran()">Tam Ekran</button>
  </div>
 </div>
</div>
<div class="alt">
 <div class="sekmeler">
  <button class="sek" id="sekG" onclick="sekme('gun')">Günlük</button>
  <button class="sek" id="sekH" onclick="sekme('hafta')">Haftalık</button>
 </div>
 <div id="ozet"></div>
</div>
<div id="tam" onclick="tamKapat()">
 <div class="ad" id="tamAd"></div>
 <div class="buyuk" id="tamZaman">00:00:00</div>
 <div class="ipucu">Kapatmak için ekrana dokun</div>
</div>
<script>
const DERSLER={Matematik:'#e53935',Fizik:'#43a047',Kimya:'#fdd835',Biyoloji:'#ab47bc'};
const KEY='dersSayacVeri',BG='dersSayacArka';
let veri=JSON.parse(localStorage.getItem(KEY)||'{"kayitlar":[]}');
let secili=null,calisiyor=false,baslangic=0,biriken=0,tick=null,aktifSekme=null;

function kaydet(){localStorage.setItem(KEY,JSON.stringify(veri))}
function yerelGun(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function haftaBasi(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return yerelGun(d)}
function sure(sn){const s=Math.floor(sn);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function kisa(sn){const m=Math.floor(sn/60);return Math.floor(m/60)+' sa '+(m%60)+' dk'}
function gecen(){return biriken+(calisiyor?(Date.now()-baslangic)/1000:0)}
function topla(ders,filtre){return veri.kayitlar.filter(k=>k.ders===ders&&filtre(k)).reduce((a,k)=>a+k.sn,0)}

function arkaUygula(){
 const img=localStorage.getItem(BG);
 const v=img?'url('+img+')':'none';
 document.body.style.backgroundImage=v;
 document.getElementById('tam').style.backgroundImage=v;
}
document.getElementById('dosya').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const img=new Image(),url=URL.createObjectURL(f);
 img.onload=()=>{
  const c=document.createElement('canvas');
  const o=Math.min(1,1600/Math.max(img.width,img.height));
  c.width=img.width*o;c.height=img.height*o;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  try{localStorage.setItem(BG,c.toDataURL('image/jpeg',.8))}catch(x){alert('Fotoğraf çok büyük, daha küçük bir tane dene.')}
  arkaUygula();URL.revokeObjectURL(url);
 };
 img.src=url;
};
function arkaSil(){localStorage.removeItem(BG);arkaUygula()}

function listeCiz(){
 const el=document.getElementById('liste');el.innerHTML='';
 Object.keys(DERSLER).forEach(d=>{
  const div=document.createElement('div');
  div.className='ders'+(secili===d?' aktif':'');
  div.style.color=DERSLER[d];
  div.textContent=d;
  div.onclick=()=>sec(d);
  el.appendChild(div);
 });
}
function sec(d){
 if(calisiyor||biriken>0){alert('Önce şu anki süreyi bitirip kaydet.');return}
 secili=d;
 const s=document.getElementById('secili');
 s.textContent=d;s.style.color=DERSLER[d];
 const t=document.getElementById('tamAd');
 t.textContent=d;t.style.color=DERSLER[d];
 listeCiz();
}
function baslat(){
 if(!secili){alert('Önce soldan bir ders seç.');return}
 if(calisiyor)return;
 calisiyor=true;baslangic=Date.now();tick=setInterval(guncelle,250);
}
function duraklat(){
 if(!calisiyor)return;
 biriken+=(Date.now()-baslangic)/1000;
 calisiyor=false;clearInterval(tick);guncelle();
}
function bitir(){
 if(!secili)return;
 duraklat();
 if(biriken>=1){veri.kayitlar.push({ders:secili,gun:yerelGun(new Date()),sn:Math.floor(biriken)});kaydet()}
 biriken=0;guncelle();listeCiz();ozetCiz();
}
function guncelle(){
 const t=sure(gecen());
 document.getElementById('zaman').textContent=t;
 document.getElementById('tamZaman').textContent=t;
}

function sekme(a){
 aktifSekme=(aktifSekme===a)?null:a;
 ozetCiz();
}
function ozetCiz(){
 document.getElementById('sekG').classList.toggle('aktif',aktifSekme==='gun');
 document.getElementById('sekH').classList.toggle('aktif',aktifSekme==='hafta');
 const el=document.getElementById('ozet');el.innerHTML='';
 if(!aktifSekme)return;
 const bugun=yerelGun(new Date()),hb=haftaBasi();
 if(aktifSekme==='hafta'){
  const adlar=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
  const p=new Date(hb+'T00:00:00');
  let toplamH=0;
  adlar.forEach((ad,i)=>{
   const d=new Date(p);d.setDate(p.getDate()+i);
   const g=yerelGun(d);
   const t=veri.kayitlar.filter(k=>k.gun===g).reduce((a,k)=>a+k.sn,0);
   toplamH+=t;
   const r=document.createElement('div');r.className='satir';
   r.innerHTML='<span>'+ad+'</span><span>'+kisa(t)+'</span>';
   el.appendChild(r);
  });
  const rt=document.createElement('div');rt.className='satir toplam';
  rt.innerHTML='<span>Toplam</span><span>'+kisa(toplamH)+'</span>';
  el.appendChild(rt);
  return;
 }
 const filtre=(k=>k.gun===bugun);
 let top=0;
 Object.keys(DERSLER).forEach(d=>{
  const t=topla(d,filtre);top+=t;
  const r=document.createElement('div');r.className='satir';
  r.innerHTML='<span style="color:'+DERSLER[d]+'">'+d+'</span><span style="color:'+DERSLER[d]+'">'+kisa(t)+'</span>';
  el.appendChild(r);
 });
 const r=document.createElement('div');r.className='satir toplam';
 r.innerHTML='<span>Toplam</span><span>'+kisa(top)+'</span>';
 el.appendChild(r);
}

function tamEkran(){
 if(!secili){alert('Önce soldan bir ders seç.');return}
 document.getElementById('tam').style.display='flex';
 if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
}
function tamKapat(){
 document.getElementById('tam').style.display='none';
 if(document.fullscreenElement)document.exitFullscreen();
}
arkaUygula();listeCiz();ozetCiz();guncelle();
</script>
</body>
</html>
